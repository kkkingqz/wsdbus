name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dbus-daemon for private-bus tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          PROPTEST_CASES: '2000'

  gnome-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs
      - run: gjs -m gnome-extension/tests/run-tests.js
